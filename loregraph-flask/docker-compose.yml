services:
  postgres:
    image: postgres:17-alpine
    container_name: loregraph_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: loregraph
      POSTGRES_PASSWORD: loregraph_dev
      POSTGRES_DB: loregraph
    ports:
      - "5432:5432"
    volumes:
      - loregraph_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loregraph -d loregraph"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  loregraph_pg_data:
